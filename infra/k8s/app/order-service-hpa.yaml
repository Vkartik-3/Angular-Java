# Scales the saga orchestrator on CPU. minReplicas 2 keeps the concurrent
# outbox / timeout-job behaviour described in infra/k8s/README.md; every
# replica is safe to add because both jobs claim rows with SKIP LOCKED.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: groove
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
