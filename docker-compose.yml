services:

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry:3.1.7
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      QUARKUS_PROFILE: dev
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-product}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: product
    volumes:
      - mongo-data:/data/db
      - ./infra/docker/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    image: ghcr.io/vkartik-3/angular-java/order-service:latest
    build:
      context: backend/order-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  payment-service:
    image: ghcr.io/vkartik-3/angular-java/payment-service:latest
    build:
      context: backend/payment-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  inventory-service:
    image: ghcr.io/vkartik-3/angular-java/inventory-service:latest
    build:
      context: backend/inventory-service
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio-registry:
        condition: service_healthy

  product-service:
    image: ghcr.io/vkartik-3/angular-java/product-service:latest
    build:
      context: backend/product-service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_MONGODB_HOST: mongo
      SPRING_MONGODB_DATABASE: product
      SPRING_MONGODB_USERNAME: ${MONGO_USER:-product}
      SPRING_MONGODB_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
      SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/groove/protocol/openid-connect/certs
    depends_on:
      mongo:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/keycloak/groove-realm.json:/opt/keycloak/data/import/groove-realm.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  gateway:
    image: ghcr.io/vkartik-3/angular-java/gateway:latest
    build:
      context: backend/gateway
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      product-service:
        condition: service_started
      keycloak:
        condition: service_healthy

  frontend:
    image: ghcr.io/vkartik-3/angular-java/frontend:latest
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - gateway

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: --kafka.server=kafka:9092
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.11.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - order-service
      - payment-service
      - inventory-service

  loki:
    image: grafana/loki:3.7.0
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki.yml

  alloy:
    image: grafana/alloy:v1.8.1
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/groove-saga.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  mongo-data:
  grafana-data:
  loki-data:
