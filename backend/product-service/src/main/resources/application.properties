spring.application.name=product-service
logging.pattern.console=%d{HH:mm:ss} %-5p [product-service] [%c{1}] [corrId=%X{correlationId}] [orderId=%X{orderId}] %m%n
server.port=8084

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=product
spring.mongodb.username=${MONGO_USER}
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.authentication-database=admin

# Do not auto-run batch jobs on startup — jobs are triggered explicitly via REST
spring.batch.job.enabled=false

management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.access=unrestricted

# JWT — JWK URI avoids OIDC discovery on startup (no Keycloak dependency at boot time)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/groove/protocol/openid-connect/certs
# With jwk-set-uri also set, Spring validates the iss claim without an OIDC discovery call at boot.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/groove}
# Health details and Prometheus stay public for probes/scraping; nothing else is exposed.
management.endpoint.health.show-details=never
