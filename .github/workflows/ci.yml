name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrappers executable
        run: chmod +x backend/order-service/mvnw backend/payment-service/mvnw backend/inventory-service/mvnw backend/gateway/mvnw backend/product-service/mvnw

      - name: Build order-service
        run: cd backend/order-service && ./mvnw package -DskipTests

      - name: Build payment-service
        run: cd backend/payment-service && ./mvnw package -DskipTests

      - name: Build inventory-service
        run: cd backend/inventory-service && ./mvnw package -DskipTests

      - name: Build gateway
        run: cd backend/gateway && ./mvnw package -DskipTests

      - name: Build product-service
        run: cd backend/product-service && ./mvnw package -DskipTests

      - name: Test order-service
        run: cd backend/order-service && ./mvnw test

      - name: Test payment-service
        run: cd backend/payment-service && ./mvnw test

      - name: Test inventory-service
        run: cd backend/inventory-service && ./mvnw test

      - name: Test gateway
        run: |
          if find backend/gateway/src/test -name "*.java" | grep -q .; then
            cd backend/gateway && ./mvnw test
          else
            echo "No tests found, skipping"
          fi

      - name: Test product-service
        run: cd backend/product-service && ./mvnw test

      - name: Cache compiled artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            backend/order-service/target/quarkus-app/
            backend/payment-service/target/quarkus-app/
            backend/inventory-service/target/quarkus-app/
            backend/gateway/target/quarkus-app/
            backend/product-service/target/
          key: compiled-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Build
        run: cd apps/web && npm run build

      - name: Validate nginx config
        run: |
          docker run --rm --add-host gateway:127.0.0.1 \
            -v "$PWD/apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Test
        run: |
          if grep -q '"test"' apps/web/package.json; then
            cd apps/web && npm test -- --watch=false
          else
            echo "No tests found, skipping"
          fi

  e2e:
    name: e2e (full stack + Playwright)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 30
    env:
      # Throwaway credentials for an ephemeral CI stack; never used outside this job.
      POSTGRES_PASSWORD: ci-postgres-pw
      MONGO_PASSWORD: ci-mongo-pw
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-pw
      GRAFANA_ADMIN_PASSWORD: ci-grafana-pw
      KEYCLOAK_URL: http://localhost:8180
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-pw
      E2E_USER_USERNAME: e2e-user
      E2E_USER_PASSWORD: e2e-user-pw
      APP_SERVICES: >-
        kafka apicurio-registry postgres mongo keycloak
        order-service payment-service inventory-service product-service gateway frontend
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/order-service/target/quarkus-app/
            backend/payment-service/target/quarkus-app/
            backend/inventory-service/target/quarkus-app/
            backend/gateway/target/quarkus-app/
            backend/product-service/target/
          key: compiled-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Start application stack
        run: docker compose up -d --build $APP_SERVICES

      - name: Wait for services to become ready
        run: |
          wait_for() {
            for _ in $(seq 1 120); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              [ "$code" = "$2" ] && { echo "ready: $1 ($code)"; return 0; }
              sleep 3
            done
            echo "::error::timed out waiting for $1 (last status $code)"; return 1
          }
          wait_for http://localhost:8180/realms/groove 200
          wait_for http://localhost:8080/q/health/ready 200
          wait_for http://localhost:8081/q/health/ready 200
          wait_for http://localhost:8082/q/health/ready 200
          wait_for http://localhost:8084/actuator/health 200
          wait_for http://localhost:8090/api/orders 401
          wait_for http://localhost:4200/ 200

      - name: Provision test users
        run: |
          scripts/keycloak-create-user.sh "$E2E_USER_USERNAME" "$E2E_USER_PASSWORD" user
          scripts/keycloak-create-user.sh "$E2E_ADMIN_USERNAME" "$E2E_ADMIN_PASSWORD" user admin

      - name: Smoke test the API with a real token
        run: |
          TOKEN=$(curl -fsS "$KEYCLOAK_URL/realms/groove/protocol/openid-connect/token" \
            -d grant_type=password -d client_id=groove-app \
            --data-urlencode "username=$E2E_USER_USERNAME" --data-urlencode "password=$E2E_USER_PASSWORD" | jq -r .access_token)
          echo "products: $(curl -fsS http://localhost:8090/api/products -H "Authorization: Bearer $TOKEN" | jq length)"
          echo "orders:   $(curl -fsS http://localhost:8090/api/orders -H "Authorization: Bearer $TOKEN" | jq length)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "http://localhost:8090/api/payment/mode?accept=false" -H "Authorization: Bearer $TOKEN")
          [ "$code" = "403" ] || { echo "::error::non-admin reached an admin endpoint (HTTP $code)"; exit 1; }
          echo "admin endpoint correctly forbidden for role 'user'"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: apps/web
        run: npx playwright test

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150 $APP_SERVICES

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v

  docker-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/order-service/target/quarkus-app/
            backend/payment-service/target/quarkus-app/
            backend/inventory-service/target/quarkus-app/
            backend/gateway/target/quarkus-app/
            backend/product-service/target/
          key: compiled-${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push order-service
        uses: docker/build-push-action@v6
        with:
          context: backend/order-service
          file: backend/order-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/order-service:latest
            ghcr.io/vkartik-3/angular-java/order-service:${{ github.sha }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: backend/payment-service
          file: backend/payment-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/payment-service:latest
            ghcr.io/vkartik-3/angular-java/payment-service:${{ github.sha }}

      - name: Build and push inventory-service
        uses: docker/build-push-action@v6
        with:
          context: backend/inventory-service
          file: backend/inventory-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/inventory-service:latest
            ghcr.io/vkartik-3/angular-java/inventory-service:${{ github.sha }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: backend/gateway
          file: backend/gateway/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/gateway:latest
            ghcr.io/vkartik-3/angular-java/gateway:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/frontend:latest
            ghcr.io/vkartik-3/angular-java/frontend:${{ github.sha }}

      - name: Build and push product-service
        uses: docker/build-push-action@v6
        with:
          context: backend/product-service
          file: backend/product-service/Dockerfile
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/product-service:latest
            ghcr.io/vkartik-3/angular-java/product-service:${{ github.sha }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin app manifests to this commit's image tag
        run: |
          for svc in order-service payment-service inventory-service gateway product-service frontend; do
            sed -i "s#image: ghcr.io/vkartik-3/angular-java/${svc}:.*#image: ghcr.io/vkartik-3/angular-java/${svc}:${{ github.sha }}#" "infra/k8s/app/${svc}-deployment.yaml"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/app/*.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: pin k8s app images to ${{ github.sha }} [skip ci]"
            git push origin main
          fi
