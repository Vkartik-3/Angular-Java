name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrappers executable
        run: chmod +x backend/order-service/mvnw backend/payment-service/mvnw backend/inventory-service/mvnw backend/gateway/mvnw backend/product-service/mvnw

      - name: Build order-service
        run: cd backend/order-service && ./mvnw package -DskipTests

      - name: Build payment-service
        run: cd backend/payment-service && ./mvnw package -DskipTests

      - name: Build inventory-service
        run: cd backend/inventory-service && ./mvnw package -DskipTests

      - name: Build gateway
        run: cd backend/gateway && ./mvnw package -DskipTests

      - name: Build product-service
        run: cd backend/product-service && ./mvnw package -DskipTests

      - name: Test order-service
        run: cd backend/order-service && ./mvnw test

      - name: Test payment-service
        run: cd backend/payment-service && ./mvnw test

      - name: Test inventory-service
        run: cd backend/inventory-service && ./mvnw test

      - name: Test gateway
        run: |
          if find backend/gateway/src/test -name "*.java" | grep -q .; then
            cd backend/gateway && ./mvnw test
          else
            echo "No tests found, skipping"
          fi

      - name: Test product-service
        run: cd backend/product-service && ./mvnw test

      - name: Cache compiled artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            backend/order-service/target/quarkus-app/
            backend/payment-service/target/quarkus-app/
            backend/inventory-service/target/quarkus-app/
            backend/gateway/target/quarkus-app/
            backend/product-service/target/
          key: compiled-${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Build
        run: cd apps/web && npm run build

      - name: Test
        run: |
          if grep -q '"test"' apps/web/package.json; then
            cd apps/web && npm test -- --watch=false
          else
            echo "No tests found, skipping"
          fi

  docker-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Restore compiled artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/order-service/target/quarkus-app/
            backend/payment-service/target/quarkus-app/
            backend/inventory-service/target/quarkus-app/
            backend/gateway/target/quarkus-app/
            backend/product-service/target/
          key: compiled-${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/web && npm ci

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push order-service
        uses: docker/build-push-action@v6
        with:
          context: backend/order-service
          file: backend/order-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/order-service:latest
            ghcr.io/vkartik-3/angular-java/order-service:${{ github.sha }}

      - name: Build and push payment-service
        uses: docker/build-push-action@v6
        with:
          context: backend/payment-service
          file: backend/payment-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/payment-service:latest
            ghcr.io/vkartik-3/angular-java/payment-service:${{ github.sha }}

      - name: Build and push inventory-service
        uses: docker/build-push-action@v6
        with:
          context: backend/inventory-service
          file: backend/inventory-service/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/inventory-service:latest
            ghcr.io/vkartik-3/angular-java/inventory-service:${{ github.sha }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: backend/gateway
          file: backend/gateway/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/gateway:latest
            ghcr.io/vkartik-3/angular-java/gateway:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/frontend:latest
            ghcr.io/vkartik-3/angular-java/frontend:${{ github.sha }}

      - name: Build and push product-service
        uses: docker/build-push-action@v6
        with:
          context: backend/product-service
          file: backend/product-service/Dockerfile
          push: true
          tags: |
            ghcr.io/vkartik-3/angular-java/product-service:latest
            ghcr.io/vkartik-3/angular-java/product-service:${{ github.sha }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUBLISH == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin app manifests to this commit's image tag
        run: |
          for svc in order-service payment-service inventory-service gateway product-service frontend; do
            sed -i "s#image: ghcr.io/vkartik-3/angular-java/${svc}:.*#image: ghcr.io/vkartik-3/angular-java/${svc}:${{ github.sha }}#" "infra/k8s/app/${svc}-deployment.yaml"
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/app/*.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: pin k8s app images to ${{ github.sha }} [skip ci]"
            git push origin main
          fi
