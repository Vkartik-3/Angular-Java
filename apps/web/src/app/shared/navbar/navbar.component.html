<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" routerLink="/orders" aria-label="Groove home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <circle cx="16" cy="16" r="15" fill="#17161c" />
          <circle cx="16" cy="16" r="11" fill="none" stroke="#3a3842" stroke-width="0.8" />
          <circle cx="16" cy="16" r="8" fill="none" stroke="#3a3842" stroke-width="0.8" />
          <circle cx="16" cy="16" r="5" fill="#6366f1" />
          <circle cx="16" cy="16" r="1.4" fill="#f6f5f1" />
        </svg>
      </span>
      <span class="brand__name">Groove</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a class="nav__link btn-orders" routerLink="/orders" aria-label="Orders" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-list" aria-hidden="true"></i><span>Orders</span>
      </a>
      <a class="nav__link" routerLink="/orders/new" routerLinkActive="is-active" aria-label="Shop">
        <i class="pi pi-shopping-bag" aria-hidden="true"></i><span>Shop</span>
        @if (cart.count() > 0) {
          <span class="nav__badge" [attr.aria-label]="cart.count() + ' items in cart'">{{ cart.count() }}</span>
        }
      </a>
      @if (auth.hasRole('admin')) {
        <a class="nav__link btn-admin" routerLink="/admin" aria-label="Admin" routerLinkActive="is-active">
          <i class="pi pi-sliders-h" aria-hidden="true"></i><span>Admin</span>
        </a>
      }
    </nav>

    <div class="user">
      <span class="user__avatar" aria-hidden="true">{{ initial() }}</span>
      <span class="user__name">{{ auth.username }}</span>
      <button type="button" class="user__action" (click)="auth.logout()"
              [attr.aria-label]="auth.isDemo ? 'Reset demo data' : 'Log out'"
              [title]="auth.isDemo ? 'Reset demo data' : 'Log out'">
        <i class="pi" [class.pi-refresh]="auth.isDemo" [class.pi-sign-out]="!auth.isDemo" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
